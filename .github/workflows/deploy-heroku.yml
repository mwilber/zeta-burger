name: Deploy to Heroku

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy (overrides automatic deployment until the next push)
        required: true
        default: master
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Never cancel a running Heroku build: it keeps running after its caller exits.
    # Queue requests, then skip superseded requests before starting a build.
    concurrency:
      group: heroku-zeta-burger
      cancel-in-progress: false
      queue: max
    defaults:
      run:
        working-directory: app
    env:
      HEROKU_APP_NAME: zeta-burger
    steps:
      - name: Check out deployment tooling from the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .deployment
          sparse-checkout: scripts/deploy-heroku.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check out the requested commit or branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/heads/{0}', inputs.branch) || github.sha }}
          path: app
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Skip superseded deployment requests
        id: latest
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const { data: current } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: context.runId,
            });
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: current.workflow_id, per_page: 100,
            });
            const newer = data.workflow_runs.find(run =>
              run.run_number > current.run_number && run.conclusion !== 'skipped');
            core.setOutput('deploy', newer ? 'false' : 'true');
            if (newer) {
              await core.summary.addRaw(`Skipped: newer deployment request ${newer.html_url}`).write();
            }

      - name: Build and release on Heroku
        if: steps.latest.outputs.deploy == 'true'
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          git archive --format=tar.gz --prefix=zeta-burger/ --output="$RUNNER_TEMP/zeta-burger.tar.gz" HEAD
          node "$GITHUB_WORKSPACE/.deployment/scripts/deploy-heroku.mjs" "$RUNNER_TEMP/zeta-burger.tar.gz" "$(git rev-parse HEAD)"
