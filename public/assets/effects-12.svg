<svg xmlns="http://www.w3.org/2000/svg" viewBox="-80 -90 160 180" overflow="visible">
  <defs>
    <radialGradient id="thrust-glow" gradientUnits="userSpaceOnUse" fx="0" fy="20" cx="0" cy="20" r="43" fr="1">
      <stop offset="0" stop-color="#98daed40"/><stop offset="1" stop-color="#98daed00"/>
    </radialGradient>
  </defs>
  <style>
    .zeta-tip[data-negative="true"] { fill: #ff8499; }
  </style>
  <!-- Templates are cloned by the renderer; geometry and colors stay in this file. -->
  <g id="star-small"><rect width=".9" height=".9" fill="#d4cbea"/></g>
  <g id="star-large">
    <rect width="1.8" height="1.8" fill="#d4cbea"/>
    <path d="M-3 .8H4 M.8 -3V4" fill="none" stroke="#cabce8" stroke-width=".5"/>
  </g>
  <g id="gear" fill="none">
    <path d="M-12 7L-16 20 M12 7L16 20" stroke="#c7d6d0" stroke-width="2.5"/>
    <path d="M-19 21H-13 M13 21H19" stroke="#bdf77d" stroke-width="2"/>
  </g>
  <g id="ship-shadow"><ellipse cy="24" rx="27" ry="3" fill="#151d2955"/></g>
  <g id="vertical-thrust">
    <ellipse cy="22" rx="38" ry="28" fill="url(#thrust-glow)"/>
    <ellipse data-wave="0" fill="none" stroke="#98daed"/>
    <ellipse data-wave="1" fill="none" stroke="#bdf77d"/>
    <ellipse data-wave="2" fill="none" stroke="#98daed"/>
    <ellipse data-wave="3" fill="none" stroke="#bdf77d"/>
  </g>
  <g id="horizontal-thrust" fill="none" stroke="#98daed" stroke-width="1.5">
    <ellipse data-wave="0"/><ellipse data-wave="1"/><ellipse data-wave="2"/>
  </g>
  <g id="carried-order" font-family="monospace" text-anchor="middle">
    <rect x="16" y="-18" width="9" height="10" rx="1" fill="#dbb382"/>
    <rect x="18" y="-21" width="5" height="3" rx="1" fill="#d5ba94"/>
    <path d="M18 -13H23" stroke="#5f6048"/>
    <text class="zeta-tip" data-tip="" x="21" y="-30" fill="#c8f8a0" font-size="12" font-weight="bold"/>
    <text data-destination="" y="-46" fill="#c8f8a0" font-size="9"/>
  </g>
  <g id="waiting-order" font-family="monospace" text-anchor="middle">
    <rect x="-7" y="-12" width="14" height="14" rx="2" fill="#dbb382"/>
    <path d="M0 -12V2" stroke="#8e754f" stroke-width="2"/>
    <text class="zeta-tip" data-tip="" y="-22" fill="#bdf77d" font-size="12" font-weight="bold"/>
    <text data-count="" y="15" fill="#e9d2af" font-size="9"/>
  </g>
  <g id="service" font-family="monospace" text-anchor="middle">
    <g data-dwell="">
      <rect x="-18" y="-56" width="36" height="3" rx="1" fill="#2d414e"/>
      <rect data-progress="" x="-18" y="-56" height="3" rx="1" fill="#bdf77d"/>
    </g>
    <text data-refuel="" y="-66" fill="#98daed" font-size="10" font-weight="bold"/>
  </g>
  <g id="particle" data-crash-colors="#ffffff,#bce9ff,#78b6d5" data-service-color="#bdf77d">
    <rect width="1" height="1" rx=".25"/>
  </g>
  <g id="crash-message" font-family="monospace" text-anchor="middle">
    <text x="640" y="420" fill="#f4c2ce" font-size="22" font-weight="bold">SAUCER LOST</text>
    <text data-message="" x="640" y="449" fill="#c7b6d4" font-size="10"/>
  </g>

  <g id="storm-rain"><path d="" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/></g>
</svg>
