<svg xmlns="http://www.w3.org/2000/svg" viewBox="-80 -90 160 180" overflow="visible">
  <defs>
    <radialGradient id="thrust-glow" gradientUnits="userSpaceOnUse" fx="0" fy="20" cx="0" cy="20" r="43" fr="1">
      <stop offset="0" stop-color="#72e6dc40"/><stop offset="1" stop-color="#72e6dc00"/>
    </radialGradient>
  </defs>
  <style>
    .zeta-tip[data-negative="true"] { fill: #72e6dc; }
  </style>
  <!-- Templates are cloned by the renderer; geometry and colors stay in this file. -->
  <g id="star-small"><circle r="1.1" fill="#a0e8df" opacity=".55"/></g>
  <g id="star-large"><circle r="2.4" fill="none" stroke="#b9fff2" stroke-width=".7"/><circle cx="-.7" cy="-.7" r=".55" fill="#e2fff4"/></g>
  <g id="gear" fill="none">
    <path d="M-12 7L-16 20 M12 7L16 20" stroke="#dcfff0" stroke-width="2.5"/>
    <path d="M-19 21H-13 M13 21H19" stroke="#72e6dc" stroke-width="2"/>
  </g>
  <g id="ship-shadow"><ellipse cy="24" rx="27" ry="3" fill="#082e3b55"/></g>
  <g id="vertical-thrust">
    <ellipse cy="22" rx="38" ry="28" fill="url(#thrust-glow)"/>
    <ellipse data-wave="0" fill="none" stroke="#72e6dc"/>
    <ellipse data-wave="1" fill="none" stroke="#72e6dc"/>
    <ellipse data-wave="2" fill="none" stroke="#72e6dc"/>
    <ellipse data-wave="3" fill="none" stroke="#72e6dc"/>
  </g>
  <g id="horizontal-thrust" fill="none" stroke="#72e6dc" stroke-width="1.5">
    <ellipse data-wave="0"/><ellipse data-wave="1"/><ellipse data-wave="2"/>
  </g>
  <g id="carried-order" font-family="monospace" text-anchor="middle">
    <rect x="16" y="-18" width="9" height="10" rx="1" fill="#72e6dc"/>
    <rect x="18" y="-21" width="5" height="3" rx="1" fill="#72e6dc"/>
    <path d="M18 -13H23" stroke="#1b5663"/>
    <text class="zeta-tip" data-tip="" x="21" y="-30" fill="#dcfff0" font-size="12" font-weight="bold"/>
    <text data-destination="" y="-46" fill="#dcfff0" font-size="9"/>
  </g>
  <g id="waiting-order" font-family="monospace" text-anchor="middle">
    <rect x="-7" y="-12" width="14" height="14" rx="2" fill="#72e6dc"/>
    <path d="M0 -12V2" stroke="#1b5663" stroke-width="2"/>
    <text class="zeta-tip" data-tip="" y="-22" fill="#72e6dc" font-size="12" font-weight="bold"/>
    <text data-count="" y="15" fill="#dcfff0" font-size="9"/>
  </g>
  <g id="service" font-family="monospace" text-anchor="middle">
    <g data-dwell="">
      <rect x="-18" y="-56" width="36" height="3" rx="1" fill="#082e3b"/>
      <rect data-progress="" x="-18" y="-56" height="3" rx="1" fill="#72e6dc"/>
    </g>
    <text data-refuel="" y="-66" fill="#72e6dc" font-size="10" font-weight="bold"/>
  </g>
  <g id="particle" data-crash-colors="#72e6dc,#72e6dc,#dcfff0" data-service-color="#72e6dc">
    <rect width="1" height="1" rx=".25"/>
  </g>
  <g id="crash-message" font-family="monospace" text-anchor="middle">
    <text x="640" y="420" fill="#dcfff0" font-size="22" font-weight="bold">SAUCER LOST</text>
    <text data-message="" x="640" y="449" fill="#72e6dc" font-size="10"/>
  </g>
</svg>
