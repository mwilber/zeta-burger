<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -40 80 80" overflow="visible">
  <title>Seeker cloud</title>
  <defs>
    <radialGradient id="aura">
      <stop stop-color="#ffb0f0" stop-opacity=".3"/><stop offset=".67" stop-color="#e55cff" stop-opacity=".15"/><stop offset="1" stop-color="#bd57ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vapor" cx=".38" cy=".3" r=".72">
      <stop stop-color="#effbff" stop-opacity=".9"/><stop offset=".4" stop-color="#c98dff" stop-opacity=".78"/><stop offset=".78" stop-color="#b64cdf" stop-opacity=".5"/><stop offset="1" stop-color="#ee62c2" stop-opacity=".16"/>
